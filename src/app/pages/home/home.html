<section class="hero text-center">
  <div class="hero-badge">
    <i class="bi bi-controller"></i> Sprint #1
  </div>
  <h1 class="display-5 fw-bold mt-3">¡Bienvenido a la Sala de Juegos!</h1>
  <p class="lead text-secondary mb-4">
    Una sala para medir tus capacidades cognitivas y motrices con cuatro juegos clásicos.
  </p>
  <div class="d-flex justify-content-center gap-2 flex-wrap">
    <a routerLink="/login" class="btn btn-primary btn-lg">
      <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
    </a>
    <a routerLink="/registro" class="btn btn-outline-primary btn-lg">
      <i class="bi bi-person-plus me-1"></i> Registrarme
    </a>
    <a routerLink="/quien-soy" class="btn btn-light btn-lg">
      <i class="bi bi-person-circle me-1"></i> Quién Soy
    </a>
  </div>
</section>

<section class="mt-5">
  <h2 class="h4 mb-3"><i class="bi bi-joystick me-2"></i>Juegos</h2>
  <div class="row g-3">
    @for (j of juegos; track j.nombre) {
      <div class="col-12 col-sm-6 col-lg-3">
        <article class="card sj-game-card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <div class="sj-game-icon mb-2">
              <i class="bi" [class]="j.icono"></i>
            </div>
            <h3 class="h5">{{ j.nombre }}</h3>
            <p class="text-secondary small flex-grow-1">{{ j.descripcion }}</p>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="jugarProximamente(j)">
              <i class="bi bi-play-fill me-1"></i> Jugar
            </button>
            <small class="text-muted mt-2">Disponible en Sprint #{{ j.sprint }}</small>
          </div>
        </article>
      </div>
    }
  </div>
</section>
